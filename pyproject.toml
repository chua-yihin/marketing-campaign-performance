[project]
name = "campaign-perf"
version = "0.1.0"
description = "End-to-end campaign performance analysis: funnel, CAC, ROI and 30/60/90-day retention by channel (GA360 sample, BigQuery)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "google-cloud-bigquery==3.47.0",
    "db-dtypes==1.9.0",
    "plotly==7.2.0",
    "kaleido==1.5.2",
    "jinja2==3.1.6",
    "pyyaml==6.0.4",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/campaign_perf"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
